name: Xray Cloudflare Tunnel Lab

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # Tailscale is ONLY for your own management access (ssh/debugging).
      # It is NOT in the VPN data path.
      - name: Install Tailscale (management access only)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="dx-xray-cf"
          sudo apt-get install -y openssh-server
          sudo systemctl enable --now ssh

      - name: Install Xray
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install
          xray version

      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Generate UUID
        id: gen
        run: |
          UUID=$(cat /proc/sys/kernel/random/uuid)
          echo "UUID=$UUID" >> "$GITHUB_OUTPUT"

      - name: Configure Xray (VLESS + WebSocket, loopback only)
        env:
          UUID: ${{ steps.gen.outputs.UUID }}
        run: |
          sudo mkdir -p /usr/local/etc/xray
          sudo tee /usr/local/etc/xray/config.json > /dev/null <<EOF
          {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {
                "listen": "127.0.0.1",
                "port": 8080,
                "protocol": "vless",
                "settings": {
                  "clients": [ { "id": "$UUID" } ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "security": "none",
                  "wsSettings": { "path": "/ws" }
                }
              }
            ],
            "outbounds": [
              { "protocol": "freedom", "tag": "direct" },
              { "protocol": "blackhole", "tag": "block" }
            ]
          }
          EOF
          sudo xray run -test -config /usr/local/etc/xray/config.json

      - name: Start Xray
        run: |
          sudo systemctl restart xray
          sudo systemctl enable xray
          sleep 2
          sudo systemctl status xray --no-pager

      - name: Start Cloudflare Quick Tunnel
        run: |
          # setsid detaches this from the step's process group so it survives
          # after this step ends (plain nohup alone is NOT enough on GH Actions).
          setsid nohup cloudflared tunnel --url http://localhost:8080 \
            > /tmp/cloudflared.log 2>&1 < /dev/null &
          disown

          echo "Waiting for tunnel hostname..."
          for i in $(seq 1 30); do
            CF_HOST=$(grep -oE '[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1)
            if [ -n "$CF_HOST" ]; then
              echo "Tunnel ready: $CF_HOST"
              echo "CF_HOST=$CF_HOST" >> "$GITHUB_ENV"
              break
            fi
            sleep 1
          done

          if [ -z "$CF_HOST" ]; then
            echo "FAILED to get tunnel hostname, dumping log:"
            cat /tmp/cloudflared.log
            exit 1
          fi

      - name: Debug - verify tunnel end-to-end
        run: |
          echo "===== cloudflared log ====="
          cat /tmp/cloudflared.log
          echo ""
          echo "===== xray listening on loopback? ====="
          sudo ss -tlnp | grep 8080 || echo "NOT LISTENING"
          echo ""
          echo "===== self-test through the public tunnel hostname ====="
          curl -sS -o /dev/null -w "HTTP status via tunnel: %{http_code}\n" \
            "https://$CF_HOST/ws" --max-time 10 || echo "curl failed"

      - name: Build and show client config
        env:
          UUID: ${{ steps.gen.outputs.UUID }}
        run: |
          LINK="vless://${UUID}@${CF_HOST}:443?encryption=none&security=tls&type=ws&host=${CF_HOST}&path=%2Fws&sni=${CF_HOST}#DX-Xray-CF"

          echo "=========================================="
          echo "     XRAY over CLOUDFLARE TUNNEL READY"
          echo "=========================================="
          echo ""
          echo "کانفیگ (import در v2rayNG / v2box / NekoBox):"
          echo ""
          echo "$LINK"
          echo ""
          echo "------------------------------------------"
          echo "این کانفیگ از طریق Cloudflare (خروجی، نه ورودی)"
          echo "کار می‌کند، نه از Tailscale و نه IP مستقیم."
          echo "------------------------------------------"
          echo "=========================================="

      - name: Keep Server Alive
        run: |
          for i in $(seq 1 350); do
            sleep 60
            if ! pgrep -f "cloudflared tunnel" > /dev/null; then
              echo "[$i/350] WARNING: cloudflared died, restarting is NOT automatic - check logs"
            fi
            echo "[$i/350] Server running..."
          done
