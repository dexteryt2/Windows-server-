name: Xray REALITY Lab

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # Tailscale is ONLY for your own management access to the box (ssh, debugging).
      # It is NOT in the VPN data path anymore, so its throttling no longer matters.
      - name: Install Tailscale (management access only)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="dx-xray-reality"
          sudo apt-get install -y openssh-server
          sudo systemctl enable --now ssh

      - name: Install Xray
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install
          xray version

      - name: Tune kernel (BBR + buffers)
        run: |
          echo "net.core.default_qdisc=fq" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_congestion_control=bbr" | sudo tee -a /etc/sysctl.conf
          echo "net.core.rmem_max=67108864" | sudo tee -a /etc/sysctl.conf
          echo "net.core.wmem_max=67108864" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_rmem=4096 87380 67108864" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_wmem=4096 65536 67108864" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: Generate UUID + REALITY keys
        id: gen
        run: |
          UUID=$(cat /proc/sys/kernel/random/uuid)
          KEYS=$(xray x25519)
          PRIVATE_KEY=$(echo "$KEYS" | grep -i "Private" | awk '{print $NF}')
          PUBLIC_KEY=$(echo "$KEYS" | grep -i "Public" | awk '{print $NF}')
          SHORT_ID=$(openssl rand -hex 8)
          PUBLIC_IP=$(curl -s https://api.ipify.org)

          echo "UUID=$UUID" >> "$GITHUB_OUTPUT"
          echo "PRIVATE_KEY=$PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_KEY=$PUBLIC_KEY" >> "$GITHUB_OUTPUT"
          echo "SHORT_ID=$SHORT_ID" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

      - name: Configure Xray (VLESS + REALITY + Vision)
        env:
          UUID: ${{ steps.gen.outputs.UUID }}
          PRIVATE_KEY: ${{ steps.gen.outputs.PRIVATE_KEY }}
          SHORT_ID: ${{ steps.gen.outputs.SHORT_ID }}
        run: |
          sudo mkdir -p /usr/local/etc/xray
          sudo tee /usr/local/etc/xray/config.json > /dev/null <<EOF
          {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {
                "listen": "0.0.0.0",
                "port": 443,
                "protocol": "vless",
                "settings": {
                  "clients": [
                    { "id": "$UUID", "flow": "xtls-rprx-vision" }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "tcp",
                  "security": "reality",
                  "realitySettings": {
                    "show": false,
                    "dest": "www.microsoft.com:443",
                    "xver": 0,
                    "serverNames": ["www.microsoft.com"],
                    "privateKey": "$PRIVATE_KEY",
                    "shortIds": ["$SHORT_ID"]
                  }
                }
              }
            ],
            "outbounds": [
              { "protocol": "freedom", "tag": "direct" },
              { "protocol": "blackhole", "tag": "block" }
            ]
          }
          EOF
          sudo xray run -test -config /usr/local/etc/xray/config.json

      - name: Start Xray
        run: |
          sudo systemctl restart xray
          sudo systemctl enable xray
          sleep 2
          sudo systemctl status xray --no-pager

      - name: Debug - Network & Service diagnostics
        env:
          PUBLIC_IP: ${{ steps.gen.outputs.PUBLIC_IP }}
        run: |
          echo "===== listening sockets (expect xray on 0.0.0.0:443) ====="
          sudo ss -tlnp
          echo ""
          echo "===== host firewall rules ====="
          sudo iptables -L -n -v || true
          sudo ufw status verbose 2>/dev/null || echo "ufw not active"
          echo ""
          echo "===== self-test: connect to PUBLIC IP from outside-facing socket ====="
          timeout 5 bash -c "echo > /dev/tcp/$PUBLIC_IP/443" && echo "OK: 443 reachable via $PUBLIC_IP" || echo "FAIL: 443 NOT reachable via $PUBLIC_IP"
          echo ""
          echo "Public IP for reference: $PUBLIC_IP"

      - name: Build and show client config
        env:
          UUID: ${{ steps.gen.outputs.UUID }}
          PUBLIC_KEY: ${{ steps.gen.outputs.PUBLIC_KEY }}
          SHORT_ID: ${{ steps.gen.outputs.SHORT_ID }}
          PUBLIC_IP: ${{ steps.gen.outputs.PUBLIC_IP }}
        run: |
          LINK="vless://${UUID}@${PUBLIC_IP}:443?security=reality&encryption=none&pbk=${PUBLIC_KEY}&fp=chrome&type=tcp&flow=xtls-rprx-vision&sni=www.microsoft.com&sid=${SHORT_ID}#DX-Xray-Reality"

          echo "=========================================="
          echo "       XRAY REALITY LAB READY"
          echo "=========================================="
          echo ""
          echo "کانفیگ (import در v2rayNG / v2box / NekoBox):"
          echo ""
          echo "$LINK"
          echo ""
          echo "------------------------------------------"
          echo "این کانفیگ مستقیم روی IP عمومی سرور کار می‌کند،"
          echo "از تونل Tailscale/WireGuard عبور نمی‌کند."
          echo "------------------------------------------"
          echo "=========================================="

      - name: Keep Server Alive
        run: |
          for i in $(seq 1 350); do
            sleep 60
            echo "[$i/350] Xray REALITY lab running..."
          done
